name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and Dune
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocaml-nox ocaml-dune

      - name: Build
        run: dune build
